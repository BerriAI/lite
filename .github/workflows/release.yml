name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.8.1
          cache: npm
      - name: Verify release version
        run: |
          node -e 'const p = require("./package.json"); if (!/^\d+\.\d+\.\d+$/.test(p.version)) process.exit(1); if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1);'
      - run: npm ci
      - run: npm run check
      - run: npm run test:tui:startup
      - run: npm run test:tui:flow
      - run: node scripts/release/package.mjs
      - run: node scripts/release/smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.architecture }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: macos-*
          path: release-artifacts
          merge-multiple: true
      - name: Combine verified manifests
        run: node scripts/release/manifest.mjs
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/*.tar.gz release-artifacts/manifest.json scripts/install.sh --verify-tag --title "Litespeed $GITHUB_REF_NAME" --notes-file docs/release-notes.md
